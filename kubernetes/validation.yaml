
apiVersion: v1
kind: Namespace
metadata:
  name: cluster-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-test
  namespace: cluster-test
spec:
  replicas: 4
  selector:
    matchLabels:
      app: nginx-test
  template:
    metadata:
      labels:
        app: nginx-test
    spec:
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - name: http
              containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-service
  namespace: cluster-test
spec:
  type: ClusterIP
  selector:
    app: nginx-test
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
